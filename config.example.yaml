# Sequence for the show on hydra: copy to /mnt/stick/config.yaml
# (or: make sequence CONFIG=config.example.yaml). Without that file the
# plain slideshow runs, as before. Changes are picked up while it runs.
#
# Each step is "- slideshow:" or "- scene:" with options; the option names
# are the ones of fb-slideshow.py / scene140.py (see README), e.g.
#   slideshow: minutes, hold, shuffle, transitions, duration, easing,
#              fill, clock, pile, pile_turn, directory
#   scene:     text, repeat, travel, pause, explode, background, seed,
#              color (final R,G,B), starting (X,Y percent from left/bottom),
#              timing (seconds after the previous scene; negative: overlap)
# Scenes right after each other play as one block over one background.
# show_args: options of fb-slideshow.py for the whole show (as on the
# command line); they win over the service (DEFAULT_ARGS, make config), and
# a step's own options win over them. Changing display options there
# (clock, gamma, ...) restarts the show by itself.

loop: true            # after the last step start again (false: play once)
# cloud:                # where hydra fetches the pictures (no password here;
#   address: https://cloud.example.org   # it is on hydra: make diashow-setup)
#   user: diashow
#   folder: bilder
#   pull: true          # fetch the pictures onto the stick (default false)
show_args:
  transitions: stack
  duration: 3
  easing: ease-out
sequence:
  - scene:
      text: XXX           # what flies (default XXX)
      repeat: 3
      travel: 8
  - scene:
      timing: -3          # starts 3 s before the previous scene ends
      color: 30, 180, 10  # ends green instead of red
      starting: 70, 10    # percent from the left, from the bottom
  - slideshow:
      minutes: 10     # without minutes: forever (only as the last step)
      shuffle: true
      hold: 5
      transitions: stack
